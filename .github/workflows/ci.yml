name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: TypeScript typecheck
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Verify authoritative Markdown links
        run: node scripts/verify-doc-links.mjs
      - name: Verify media and installable archive
        run: node scripts/verify-release-assets.mjs
      - name: Automated tests (non-watch)
        run: npx vitest run