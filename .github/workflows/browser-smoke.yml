name: Browser Smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm install --prefix .browser-tools --no-save --no-package-lock playwright@1.56.1
      - run: ./.browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Start app
        run: |
          (npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/kaiser-vite.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kaiser-vite.log
          exit 1
      - name: Browser checks
        run: |
          node scripts/browser-smoke.mjs
          node scripts/atlas-smoke.mjs
          node scripts/report-smoke.mjs
          node scripts/history-smoke.mjs
          node scripts/strategy-smoke.mjs
          node scripts/ganderkesee-smoke.mjs
          node scripts/provisioning-smoke.mjs
          node scripts/lifecycle-smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-shots
          path: |
            smoke-*.png
            .temp/report-*.png
            .temp/history-*.png
            .temp/strategy-*.png
            .temp/ganderkesee-*.png
            .temp/economy-*.png
            .temp/administration-*.png
            .temp/provisioning-*.png
            .temp/lifecycle-*.png
          if-no-files-found: ignore
