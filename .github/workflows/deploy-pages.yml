name: Publish HTTPS PWA (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Verify TypeScript
        run: npm run check
      - name: Unit tests
        run: npx vitest run
      - name: Build standalone offline ZIP for localhost
        run: |
          npm run build
          cp dist/downloads/kaiser-von-deutschland-offline.zip /tmp/kaiser-offline-standalone.zip
      - name: Build website under GitHub Pages base
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm run build
          cp /tmp/kaiser-offline-standalone.zip dist/downloads/kaiser-von-deutschland-offline.zip
          node scripts/verify-release-assets.mjs
      - name: Validate PWA and HTTPS paths
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/icons/kaiser-192.png
          test -s dist/icons/kaiser-512.png
          test -s dist/sw.js
          test -s dist/video-catalog.json
          test -s dist/downloads/kaiser-von-deutschland-offline.zip
          grep -q '/Kaiser_von_Deutschland-main/' dist/index.html
          grep -q '/Kaiser_von_Deutschland-main/video/' dist/video-catalog.json
      - name: Upload deployable site even if Pages is not enabled
        uses: actions/upload-artifact@v7
        with:
          name: kaiser-https-site
          path: dist
          retention-days: 7
      - name: Check GitHub Pages availability
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: token $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Pages is not configured. Enable it in Settings > Pages with Source: GitHub Actions."
              echo "Pages publishing skipped: enable GitHub Pages in Settings > Pages (Source: GitHub Actions). The kaiser-https-site artifact is available; no live site was deployed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::GitHub Pages availability check failed (HTTP $status)."
              exit 1
              ;;
          esac
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
      - name: Upload built static site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        name: Deploy to HTTPS GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
