name: Publish HTTPS PWA (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - name: Verify TypeScript
        run: npm run check
      - name: Unit tests
        run: npx vitest run
      - name: Build standalone offline ZIP for localhost
        run: |
          npm run build
          cp dist/downloads/kaiser-von-deutschland-offline.zip /tmp/kaiser-offline-standalone.zip
      - name: Build website under GitHub Pages base
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm run build
          cp /tmp/kaiser-offline-standalone.zip dist/downloads/kaiser-von-deutschland-offline.zip
          node scripts/verify-release-assets.mjs
      - name: Validate PWA and HTTPS paths
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/icons/kaiser-192.png
          test -s dist/icons/kaiser-512.png
          test -s dist/sw.js
          test -s dist/video-catalog.json
          test -s dist/downloads/kaiser-von-deutschland-offline.zip
          grep -q '/Kaiser_von_Deutschland-main/' dist/index.html
          grep -q '/Kaiser_von_Deutschland-main/video/' dist/video-catalog.json
      - name: Upload deployable site even if Pages is not enabled
        uses: actions/upload-artifact@v4
        with:
          name: kaiser-https-site
          path: dist
          retention-days: 7
      - name: Check GitHub Pages availability
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: token $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Pages is not configured. Attempting to enable via API..."
              # Build-Infos für die Aktivierung sammeln
              REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
              REPO_NAME="${GITHUB_REPOSITORY#*/}"
              # Pages via API aktivieren (Quelle: GitHub Actions)
              ENABLE_RESPONSE=$(curl --silent --show-error --write-out '%{http_code}' --output /dev/null \
                --request POST \
                --header "Authorization: token $GITHUB_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
                --data '{"source":{"branch":"main","path":"/"},"build_type":"workflow"}')
              if [ "$ENABLE_RESPONSE" = "201" ] || [ "$ENABLE_RESPONSE" = "204" ]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
                echo "GitHub Pages wurde erfolgreich aktiviert!" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::GitHub Pages konnte nicht automatisch aktiviert werden (HTTP $ENABLE_RESPONSE)."
                echo "Bitte aktivieren Sie Pages manuell unter Settings > Pages > Source: GitHub Actions."
                echo "Pages publishing skipped. Das kaiser-https-site-Artefakt ist verfügbar." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *)
              echo "::error::GitHub Pages availability check failed (HTTP $status)."
              exit 1
              ;;
          esac
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload built static site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        name: Deploy to HTTPS GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
